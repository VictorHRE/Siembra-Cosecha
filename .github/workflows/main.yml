# Deploy to Somee Hosting Pipeline
# 
# This workflow deploys the application to Somee hosting when:
# - A push is made to the 'main' branch (includes merged Pull Requests)
#
# Required GitHub Secrets (configure in repository Settings > Secrets > Actions):
# - FTP_SERVER: The FTP server hostname (e.g., ferreterialaunion.somee.com)
# - FTP_USERNAME: Your Somee FTP username
# - FTP_PASSWORD: Your Somee FTP password
# - FTP_SERVER_DIR: The server directory path (e.g., ./www.FerreteriaLaUnion.somee.com/)
# - PRODUCTION_CONNECTION_STRING: The production database connection string

name: Deploy to Somee

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ya no necesitas el 'if' complejo porque el workflow solo se dispara en 'push' a 'main'
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Update connection string for production
        run: |
          cd ./publish
          # Use sed to replace the cadenaSQL value in appsettings.json
          # Using non-greedy pattern [^"]* to match only the connection string value
          sed -i 's|"cadenaSQL": "Server=[^"]*"|"cadenaSQL": "${{ secrets.PRODUCTION_CONNECTION_STRING }}"|g' appsettings.json
          # Also handle connection strings starting with 'workstation id='
          sed -i 's|"cadenaSQL": "workstation id=[^"]*"|"cadenaSQL": "${{ secrets.PRODUCTION_CONNECTION_STRING }}"|g' appsettings.json
          echo 'Connection string updated successfully'

      - name: Deploy to Somee via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
